name: build

on:
  workflow_dispatch
  # push:
  #   branches: [master]
  # pull_request:
  #   branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Validates the wrapper checksum and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/"
